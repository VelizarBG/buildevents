plugins {
	id 'net.fabricmc.fabric-loom-remap'
	id 'me.modmuss50.mod-publish-plugin'
	id 'maven-publish'
}

version = project.mod_version + '+' + project.minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url 'https://maven.nucleoid.xyz' } // server translations
}

afterEvaluate {
	loom.runs.configureEach {
		// JRE with DCEVM required https://github.com/JetBrains/JetBrainsRuntime/releases
		//vmArg "-XX:+AllowEnhancedClassRedefinition"

		// https://gist.github.com/maityyy/3dbcd558d58a6412c3a2a38c72706e8e
		vmArg "-javaagent:${ configurations.compileClasspath.find { it.name.contains("sponge-mixin") } }"

		// https://github.com/SpongePowered/Mixin/wiki/Mixin-Java-System-Properties
		property "mixin.debug.export=true" // export classes with all mixin changes to run/.mixin.out

		//programArgs "--username=VelizarBG", "--uuid=2990d3e0-928c-49a8-a1f0-3c6931f931fb"
	}
}


dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation include("xyz.nucleoid:server-translations-api:${project.server_translations}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_dependency", project.minecraft_dependency
	inputs.property "loader_dependency", project.loader_dependency
	inputs.property "fabric_api_version", project.fabric_api_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_dependency": project.minecraft_dependency,
				"loader_dependency": project.loader_dependency,
				"fabric_api_version": project.fabric_api_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

publishMods {
	file = jar.archiveFile
	additionalFiles.from(sourcesJar.archiveFile)
	version = "$project.version"
	displayName = "v$project.mod_version+$project.title_version"
	type = STABLE
	modLoaders = ["fabric"]

	System.getenv("changelog")?.with { String changelogg ->
		changelog = changelogg
	}

	System.getenv("curse_api_key")?.with { String key ->
		curseforge {
			accessToken = key
			projectId = project.curseforge_id
			minecraftVersions = [*project.release_versions.split(" ")]
			javaVersions.add(JavaVersion.VERSION_21)

			requires('fabric-api')
		}
	}

	System.getenv("modrinth_key")?.with { String key ->
		modrinth {
			accessToken = key
			projectId = project.modrinth_id
			minecraftVersions = [*project.release_versions.split(" ")]

			requires('fabric-api')
		}
	}

	// When dry run is enabled the release assets will be saved to the build directory for testing.
//	dryRun = true
}
